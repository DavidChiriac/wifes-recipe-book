<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d6a4f"/>
      <stop offset="100%" style="stop-color:#1b4332"/>
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8e8e8"/>
    </linearGradient>
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#52b788"/>
      <stop offset="100%" style="stop-color:#40916c"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner shadow -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#1b4332" stroke-width="2" opacity="0.3"/>
  
  <!-- Chef hat - main puffy top -->
  <ellipse cx="256" cy="195" rx="95" ry="85" fill="url(#hatGrad)" stroke="#d4d4d4" stroke-width="2"/>
  
  <!-- Chef hat - left puff -->
  <ellipse cx="185" cy="210" rx="45" ry="50" fill="url(#hatGrad)" stroke="#d4d4d4" stroke-width="1.5"/>
  
  <!-- Chef hat - right puff -->
  <ellipse cx="327" cy="210" rx="45" ry="50" fill="url(#hatGrad)" stroke="#d4d4d4" stroke-width="1.5"/>
  
  <!-- Chef hat - center puff overlay -->
  <ellipse cx="256" cy="175" rx="70" ry="65" fill="url(#hatGrad)" stroke="#d4d4d4" stroke-width="1"/>
  
  <!-- Chef hat - top small puff -->
  <ellipse cx="256" cy="145" rx="40" ry="35" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Chef hat - body/cylinder -->
  <rect x="175" y="235" width="162" height="75" rx="5" fill="url(#hatGrad)" stroke="#d4d4d4" stroke-width="1.5"/>
  
  <!-- Hat band -->
  <rect x="175" y="290" width="162" height="22" rx="3" fill="url(#bandGrad)"/>
  
  <!-- Decorative lines on hat body (illustrated feel) -->
  <line x1="195" y1="250" x2="195" y2="288" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="220" y1="245" x2="220" y2="288" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="245" y1="242" x2="245" y2="288" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="270" y1="242" x2="270" y2="288" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="295" y1="245" x2="295" y2="288" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="318" y1="250" x2="318" y2="288" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Small leaf decoration on band -->
  <path d="M240 301 Q248 293 256 301 Q264 293 272 301" fill="none" stroke="#d8f3dc" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Text: "Wife's" -->
  <text x="256" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#d8f3dc" letter-spacing="1">Wife's</text>
  
  <!-- Text: "Recipe Book" -->
  <text x="256" y="405" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#b7e4c7" letter-spacing="2">Recipe Book</text>
  
  <!-- Small decorative dots -->
  <circle cx="160" cy="375" r="3" fill="#52b788" opacity="0.6"/>
  <circle cx="352" cy="375" r="3" fill="#52b788" opacity="0.6"/>
  <circle cx="165" cy="395" r="2" fill="#52b788" opacity="0.4"/>
  <circle cx="347" cy="395" r="2" fill="#52b788" opacity="0.4"/>
</svg>
