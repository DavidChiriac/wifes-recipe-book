<div [ngClass]="{'recipe-collection': isMobile() === false, 'recipe-collection-mobile': isMobile()}">
  <div class="search-bar">
    <div class="right">
      <span class="input-icon-left">
        @if (searchTerm().length > 0) {
            <i class="pi pi-times cursor-pointer" (click)="searchTerm.set('')"></i>
        } @else {
            <i class="pi pi-search cursor-pointer"></i>
        }
        <input type="text" class="h-full global-inputtext" [ngClass]="{mobile: isMobile}" pInputText placeholder="Search" 
                [value]="searchTerm()" (keydown.enter)="updateSearchTerm($event)"/>
      </span>
      <div class="flex align-items-center cursor-pointer" (click)="filtersVisible.set(true)"><i class="pi pi-filter mr-1"></i>@if(isMobile() === false) {Filters}</div>
      <p-drawer [(visible)]="filtersVisible" header="Filters" position="bottom">
        <form [formGroup]="filtersForm" (ngSubmit)="applyFilters()">
          <div class="flex flex-column gap-3">
            <p-floatLabel>
              <label for="category">Category</label>
              <p-multiSelect id="category" optionLabel="name" optionValue="name" formControlName="category" [options]="categoryOptions" />
            </p-floatLabel>
            <p-button label="Apply Filters" type="submit" class="apply-filters-button"/>
          </div>

        </form>
    </p-drawer>
    </div>
  </div>
  <div class="recipes-container">
      @for (recipe of recipes$ | async; track recipe.documentId) {
        <div class="recipe">
          <app-recipe-card [card]="recipe" [isFavourite]="recipe.isFavourite ?? false"></app-recipe-card>
        </div>
      }
  </div>
  <p-paginator (onPageChange)="onLazyLoad($event)" [alwaysShow]="false" [rowsPerPageOptions]="[10, 20, 50]" [first]="requestParams().first" [rows]="requestParams().pageSize" [totalRecords]="totalRecords()"/>
</div>

<p-dialog [modal]="true" [showHeader]="false" [(visible)]="errorModalVisible" [style]="{ width: '25rem' }">
    <h3 class="mb-3 text-center">{{errorMessage}}</h3>
    <div class="flex justify-content-center gap-2">
        <p-button label="Close" class="delete-button" severity="secondary" (click)="cancel()" />
    </div>
</p-dialog>
