<div [ngClass]="{ 'homepage-mobile': isMobile(), homepage: isMobile() === false }">
  <app-homepage-presentation></app-homepage-presentation>

  <div class="categories">
    @for (category of categories$ | async; track $index) {
      <div class="category" (click)="navigateWithCategory(category.name)">
        <div class="icon">
          <img [src]="category.icon"/>
        </div>
        <div class="name">
          {{category.name}}
        </div>
      </div>
    }
  </div>
</div>
