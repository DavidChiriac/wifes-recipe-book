@if(loading()){
<div class="flex justify-content-center align-items-center" style="height: 100%">
  <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
</div>
}
@if(!loading()){
<div [ngClass]="{'recipe-collection': isMobile() === false, 'recipe-collection-mobile': isMobile()}">
  <app-filters [filtersForm]="filtersForm" [isMobile]="!!isMobile()" [categoryOptions]="categoryOptions" [authorOptions]="authorOptions()" [(filtersVisible)]="filtersVisible" (applyFiltersOutput)="applyFilters($event)" (clearFilters)="clearFilters()"></app-filters>
  <app-search-bar (clearFilters)="clearFilters()" [(filtersVisible)]="filtersVisible" [formIsEmpty]="formIsEmpty()" [isMobile]="!!isMobile()" [(searchTerm)]="searchTerm" [(sortField)]="sortField"></app-search-bar>

  @if (requestParams().authorName) {
    <div class="author-filter-chip">
      <i class="pi pi-user"></i>
      Recipes by <strong>{{ requestParams().authorName }}</strong>
      <button class="chip-clear" (click)="clearFilters()" aria-label="Clear author filter">
        <i class="pi pi-times"></i>
      </button>
    </div>
  }

  <div class="recipes-container">
      @for (recipe of recipes(); track recipe.documentId) {
        <div class="recipe">
          <app-recipe-card [card]="recipe" [isFavourite]="recipe.isFavourite ?? false"></app-recipe-card>
        </div>
      }

      @if(recipes().length === 0){
        <p>No recipes found.</p>
      }
  </div>
  <p-paginator (onPageChange)="onLazyLoad($event)" [alwaysShow]="false" [rowsPerPageOptions]="[10, 20, 50]" [first]="requestParams().first" [rows]="requestParams().pageSize" [totalRecords]="totalRecords()"/>
</div>
}

<p-dialog [modal]="true" [showHeader]="false" [(visible)]="errorModalVisible" [style]="{ width: '25rem' }">
    <h3 class="mb-3 text-center">{{errorMessage()}}</h3>
    <div class="flex justify-content-center gap-2">
        <p-button label="Close" class="delete-button" severity="secondary" (click)="cancel()" onkeydown=""/>
    </div>
</p-dialog>
