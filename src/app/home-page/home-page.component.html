@if (loading()) {
  <div class="flex justify-content-center align-items-center" style="height: calc(100vh - 55px)">
    <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
  </div>
}
@if (!loading()) {
<div [ngClass]="{ 'homepage-mobile': isMobile(), homepage: isMobile() === false }">
  <div class="categories">
    @for (category of categories(); track $index) {
      <div class="category" (click)="navigateWithCategory(category.name)" onkeydown="">
        <div class="icon">
          <img [src]="category.icon" [alt]="category.name"/>
        </div>
        <div class="name">
          {{category.name}}
        </div>
      </div>
    }
  </div>

  @for(category of recipesArranged(); track category.category) {
    @if(category.recipes.length > 0) {
      <div class="w-full flex align-items-center justify-content-between mt-5">
          <h2 class="w-fit-content">{{category.category}}</h2>
          <p-button class="outline" label="View all" [routerLink]="'/collection'" [queryParams]="{category: category.category}" [ngClass]="{mobile: isMobile}"/>
      </div>
      <div [ngClass]="{'recommended-recipes-container-mobile': isMobile()}">
          <div [ngClass]="{'recommended-recipes': isMobile() === false, 'recommended-recipes-mobile': isMobile()}">

              @for (recipe of category.recipes; track $index) {
                  <div class="recipe">
                      <app-recipe-card [card]="recipe" [isFavourite]="recipe.isFavourite ?? false"></app-recipe-card>
                  </div>
              }
          </div>
      </div>
    }
  }
</div>
}
